name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        type: choice
        options:
          - dev
          - prod

      client:
        description: "Client folder (e.g. example-client)"
        required: true
        type: choice
        options:
          - example-client

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      WORKING_DIR: terraform/clients/${{ github.event.inputs.client }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # --- AWS AUTH (OIDC, no secrets) ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::897722707788:role/github-terraform-role
          aws-region: eu-west-2

      # --- Terraform Setup ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config=backend_config/${{ github.event.inputs.environment }}.conf

      # --- Select tfvars dynamically ---
      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var-file=tfvars/${{ github.event.inputs.environment }}.tfvars

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var-file=tfvars/${{ github.event.inputs.environment }}.tfvars